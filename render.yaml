# Render.com 部署配置
# 免费层：每月 750 小时，15分钟无活动会休眠
# 配合 UptimeRobot 定期 ping /health 防止休眠
services:
  - type: web
    name: whiteboard-server
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
